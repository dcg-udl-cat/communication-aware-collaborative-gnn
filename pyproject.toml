[project]
name = "collaborative-edge-gnn"
version = "1.0.0"
description = "Communication-aware collaborative GNN inference experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Oriol Agost Batalla", email = "oriol.agost@udl.cat" }]
license = "MIT"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pytest>=8.0",
    "scikit-learn>=1.4",
    "scipy>=1.17",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "torchvision>=0.17",
]

[project.urls]
Repository = "https://github.com/dcg-udl-cat/communication-aware-collaborative-gnn"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
