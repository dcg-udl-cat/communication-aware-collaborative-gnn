name: Tests

on:
  push:
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t collaborative-edge-gnn .

      - name: Run unit tests in Docker
        run: docker run --rm collaborative-edge-gnn python -m pytest -q
